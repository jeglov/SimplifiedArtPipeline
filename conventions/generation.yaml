# Concept image checks (gen.core.concept): is this image usable for
# image-to-3D? Both the image and its BiRefNet mask are sampled on a grid
# (cheap, and robust to single-pixel noise). The background check reads the
# image's border ring; the object checks read the mask, the same one
# image-to-3D gets (probed: a soft contact shadow is "object" by colour but
# not in the mask).
concept:
  grid: 128
  # A mask cell is object when its value is at least this (0-255).
  mask_threshold: 128
  # A pixel is background when no channel differs from the background colour
  # by more than this (0-255).
  background_tolerance: 28
  # Share of border-ring pixels that must be background: a plain backdrop.
  background_uniformity_min: 0.97
  # Share of the image the object covers. Too small: image-to-3D gets few
  # pixels of detail. Too big: the object is cropped or fills the frame.
  coverage_min: 0.06
  coverage_max: 0.70
  # Object bounding box distance to every edge, as a share of the image side.
  margin_min: 0.02
  # Largest connected object region / all object pixels: one object, not a set.
  single_object_min: 0.95
  # Object regions smaller than this many grid cells are ignored as specks.
  speck_cells: 4

# Image to 3D (gen.cli model, workflow model_trellis2). Probed on the coin:
# the raw TRELLIS.2 mesh is ~19.6M triangles, so it is remeshed coarse
# first, then decimated with QEM placement to the class budget.
model:
  # Decimation target = tris_max x this. QEM lands at or a little under the
  # target; the margin leaves room for the Maya fixes (e.g. triangulating).
  face_budget_share: 0.9
  # Remesh grid before decimation. 128 gave ~113k closed, manifold triangles
  # on the coin and kept the star relief at 270 triangles; it is also the
  # high-poly the normal map is baked from.
  remesh_resolution: 128
  # model.uv_overlap: the baked texture may share at most this share of its
  # used UV area between triangles. Probed on the first six models: the
  # overlap is a fold INSIDE a chart (2 triangles on the cactus at every
  # packing resolution from 256 to 2048, and with the "adaptive" segmenter),
  # so it can't be packed away. Measured shares: cactus 0.03 % (~11 texels at
  # 256 px, invisible), heart 0.65 %, coin 2.5 %, crate 3.0 % (visible bake
  # errors). 0.5 % is ~160 texels at 256 px.
  uv_overlap_max_share: 0.005

# Ingest into Maya (gen.cli ingest). Image-to-3D outputs have no real size
# (every mesh is ~1 unit), so the largest dimension is set per class. Must
# sit inside the class's size_cm range in mesh_budgets.yaml (checked at use).
ingest:
  size_cm:
    pickup: 40       # a coin or gem read from a phone-camera distance
    prop_small: 60   # crate, cone, potted plant

# The repair loop (gen.core.repair): what a failed stage does next. The first
# blocking failure in the stage's report picks the action:
#   retry  same stage, next seed (seed = base + attempt_index x seed_step)
#   stop   hand over to a human: another seed can't fix it
# A tool error (exit 2) always stops. Every attempt is recorded in the
# generate report.
repair:
  max_attempts: 3          # per stage: a model attempt costs ~4 GPU minutes on 8 GB
  seed_step: 1000
  default: stop            # an unlisted check id: don't guess
  actions:
    # Concept image: the framing is a dice roll; a new seed usually fixes it.
    concept.background: retry
    concept.coverage: retry
    concept.margin: retry
    concept.single_object: retry
    # Image to 3D: decimation and unwrap results vary by seed (probed: one
    # heart had 1 non-manifold edge, one coin overlapped 42 UV triangles).
    model.closed: retry
    model.manifold: retry
    model.uv: retry
    model.uv_overlap: retry
    # Over budget: decimation can't merge disconnected shells. Seen on a potion
    # whose concept was a flat 2D drawing: 191 fragments, 5030 triangles for a
    # 300 budget. Neither a workflow bug nor a seed fixes that: a human (or a
    # new concept, backlog #53) does.
    model.triangles: stop
    model.textures: stop   # the workflow didn't bake: a workflow bug, not bad luck
