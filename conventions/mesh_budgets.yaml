# artpipe mesh budgets: per asset class, for hybrid-casual mobile.
#
# Target device: low/mid Android (~3 GB RAM, Mali-G52 / Adreno 610 class).
# This is the device that sets the floor for a Voodoo-style live game.
# Rough whole-frame budget at 60 fps: ~150k triangles on screen and ~100 draw
# calls. Each class budget below is derived from how many of those assets
# are typically on screen at once.
#
# Every class inherits from `defaults`. The loader deep-merges dicts and
# replaces scalars and lists. Unknown keys are a hard error (catches typos
# like `tri_max`).
#
# tris_max is checked in Maya. verts_max is checked AFTER the Unity import
# (backlog #11): the GPU processes vertices, and every UV seam and hard edge
# splits one Maya vertex into several, which Maya's own counts don't show.
# Set to 1.5x tris_max: a smooth, few-seam prop sits well under 1.0x, a
# fully faceted one (every edge hard) near 2x, which is the waste to catch.
#
# Rule vs severity:
#   rules (uv.overlap_allowed, size_cm...)  define what is CORRECT.
#   severity_overrides                      define how BAD a violation is.

version: 1

units:
  linear: cm   # authoring unit; Unity's "Convert Units" maps cm -> m on import

defaults:
  # SM = static, SK = skinned. Must match the name prefix (naming.schema.json).
  mesh_types: [SM]

  lods:
    min: 1                  # number of LOD levels including LOD0
    max: 1
    # Max tris of LOD<n> as a fraction of LOD0. Index = LOD level.
    # Halving per level is the standard screen-coverage rule of thumb.
    max_ratio: [1.0, 0.5, 0.25, 0.125]
    tolerance: 0.10         # +10% slack before failing

  pivot:
    # Every asset must sit at the world origin with frozen transforms.
    # `mode` defines where the GEOMETRY sits relative to that pivot:
    #   bottom_center : bbox bottom-center at origin (props/characters on ground)
    #   center        : bbox center at origin (things that spin, e.g. pickups)
    #   origin        : no geometry constraint (modular kits with corner pivots)
    mode: bottom_center
    tolerance_cm: 0.5

  # Materials per mesh = submeshes = draw calls per instance. On mobile this
  # matters more than triangles for small props.
  max_materials: 1

  uv:
    required_sets: [map1]   # UV0 (Maya's default set name) = base color
    unit_square: true       # UV0 must stay inside 0-1 (no tiling)
    # Overlapping / mirrored UV0 islands are a legit mobile optimisation
    # (more texel density for free). Overlap only matters on a lightmap UV,
    # which Unity generates on import (Phase 2), so it is allowed here.
    overlap_allowed: true

  severity_overrides: {}    # {check_id: error|warning|info}

classes:
  pickup:
    description: Coins, gems, collectibles. Dozens on screen, usually spinning.
    tris_max: 300
    verts_max: 450
    size_cm: {min: 5, max: 100}
    pivot: {mode: center}

  prop_small:
    description: Small set dressing (bottle, cone, crate). Many instances.
    tris_max: 500
    verts_max: 750
    size_cm: {min: 5, max: 150}

  prop_medium:
    description: Furniture-scale props, obstacles.
    tris_max: 1500
    verts_max: 2250
    size_cm: {min: 30, max: 400}
    lods: {max: 2}

  prop_hero:
    description: Focal props the camera dwells on (chests, upgrade stations).
    tris_max: 3000
    verts_max: 4500
    size_cm: {min: 20, max: 1000}
    lods: {max: 3}
    max_materials: 2

  character:
    description: Player / boss character. 1-3 on screen.
    mesh_types: [SK]
    tris_max: 5000
    verts_max: 7500
    size_cm: {min: 50, max: 300}
    lods: {max: 3}
    max_materials: 2

  crowd_unit:
    description: Crowd / army member (runner and crowd games). 50-200 on screen, so the budget is tiny and 1 material is mandatory for GPU instancing.
    mesh_types: [SK]
    tris_max: 800
    verts_max: 1200
    size_cm: {min: 50, max: 300}

  vehicle:
    description: Cars, boats, karts.
    tris_max: 4000
    verts_max: 6000
    size_cm: {min: 100, max: 1500}
    lods: {max: 3}
    max_materials: 2

  env_module:
    description: Modular environment kit pieces (floor tiles, walls, track pieces).
    tris_max: 2000
    verts_max: 3000
    size_cm: {min: 50, max: 5000}
    lods: {max: 2}
    pivot: {mode: origin}
    uv:
      unit_square: false    # tiling textures / trim sheets go outside 0-1
    severity_overrides:
      # Backfaces players never see (wall backs, floor undersides) are
      # deleted on purpose, so open borders are expected, not an error.
      topology.open_borders: warning
