# artpipe is not pip-installed: it is run from the repo root so that
# `mayapy -m validate.maya.cli ...` resolves the package without touching
# Maya's site-packages. This file only configures tooling.
[project]
name = "artpipe"
version = "0.1.0"
description = "Agent-runnable art validation pipeline (Maya -> Unity) for mobile games."
requires-python = ">=3.9"  # Maya 2023 ships Python 3.9.7 - keep code 3.9-compatible.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import validate` works no matter
# which interpreter (system Python or mayapy) launches pytest.
pythonpath = ["."]
# tests/maya/ needs mayapy; under plain Python those tests skip themselves.
# Fast pure-Python run: artpipe test -m "not maya and not unity and not comfy"
markers = [
    "maya: needs Maya (mayapy); builds and validates real scenes",
    "unity: boots the real Unity Editor in batchmode (slow); skipped if Unity is missing",
    "comfy: starts the real ComfyUI server headless; skipped if ComfyUI is missing",
    "render: runs the pinned Chromium and ffmpeg (banners); skipped if `artpipe banners setup` has not run",
]
# Maya 2023 ships the old `future`/`past` packages, which warn on import. Not ours.
filterwarnings = ["ignore::DeprecationWarning:past.*"]
