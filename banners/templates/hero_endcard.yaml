# One template, every game: a hero hook, then an end card with the logo and
# the CTA. A game fills the slots from its kit (banners/kits/<game>/kit.yaml);
# the template never names a colour, a font file or a string.
#
# Coordinates are shares of the frame: box [x, y, w, h], so one template
# serves any placement of the same aspect. Text sizes are shares of the frame
# height. Motion: tracks of [time_s, value, easing]; x / y are offsets as a
# share of the frame, scale is a factor, rotate is degrees.
#
# Act 1 (0-5 s)  the hook: the hero is on screen from frame 0 (networks show
#                frame 0 before autoplay), headline and subline arrive.
# Act 2 (5-8 s)  the end card: headline and subline leave, the logo and the
#                CTA arrive and hold to the last frame (Unity requires an end card).
#
# Read by banners/core/template.py.
version: 1
id: hero_endcard
description: Hero hook then logo + CTA end card, 8 s.
duration_s: 8.0
# The time from which the end card must be complete (checked: banner.end_card).
end_card_from_s: 5.6

slots:
  colour: [text, text_shadow, cta, cta_text]
  font: [display, body]
  image: [background, hero, logo]
  text: [headline, subline, cta]

layers:
  # Bottom to top. Background and hero may bleed past the safe zone; text,
  # the logo and the CTA may not (banner.safe_zone).
  - id: background
    kind: image
    image: background
    fit: cover
    box: [0.0, 0.0, 1.0, 1.0]
    tracks:
      scale: [[0.0, 1.12], [8.0, 1.0, ease_out]]       # slow push-in

  - id: hero
    kind: image
    image: hero
    fit: contain
    box: [0.06, 0.26, 0.88, 0.34]
    tracks:
      scale: [[0.0, 0.9], [0.45, 1.06, ease_out], [0.8, 1.0, ease_in_out],
              [5.0, 1.0], [5.4, 0.88, ease_in_out]]
      y: [[0.8, 0.0], [2.2, -0.012, sine], [3.6, 0.0, sine], [5.0, -0.012, sine], [5.4, 0.02, ease_in_out]]

  - id: headline
    kind: text
    text: headline
    font: display
    weight: 700
    colour: text
    shadow: text_shadow
    size: 0.056              # x frame height: 107 px at 1920
    line_height: 1.05
    max_lines: 2
    align: center
    box: [0.07, 0.145, 0.86, 0.12]
    tracks:
      opacity: [[0.25, 0.0], [0.55, 1.0, ease_out], [4.8, 1.0], [5.1, 0.0, ease_in]]
      y: [[0.25, 0.02], [0.55, 0.0, ease_out]]

  - id: subline
    kind: text
    text: subline
    font: body
    weight: 700
    colour: text
    shadow: text_shadow
    size: 0.03               # 58 px
    line_height: 1.15
    max_lines: 2
    align: center
    box: [0.07, 0.575, 0.86, 0.07]
    tracks:
      opacity: [[1.1, 0.0], [1.4, 1.0, ease_out], [4.8, 1.0], [5.1, 0.0, ease_in]]

  - id: logo
    kind: image
    image: logo
    fit: contain
    box: [0.14, 0.145, 0.72, 0.12]
    tracks:
      opacity: [[5.0, 0.0], [5.3, 1.0, ease_out]]
      scale: [[5.0, 0.7], [5.5, 1.0, out_back]]

  - id: cta
    kind: button
    text: cta
    font: display
    weight: 700
    colour: cta_text
    fill: cta
    size: 0.044              # 84 px: still readable when the feed shows the video at thumbnail size
    line_height: 1.1
    max_lines: 1
    radius: 0.5              # x button height: a pill
    box: [0.22, 0.555, 0.56, 0.08]
    tracks:
      opacity: [[5.3, 0.0], [5.5, 1.0, ease_out]]
      # 1.0 -> 1.05 pulses: still inside the safe zone at the peak (checked on every frame).
      scale: [[5.3, 0.6], [5.6, 1.0, out_back], [6.3, 1.0], [6.6, 1.05, sine], [6.9, 1.0, sine],
              [7.3, 1.0], [7.6, 1.05, sine], [7.9, 1.0, sine]]
